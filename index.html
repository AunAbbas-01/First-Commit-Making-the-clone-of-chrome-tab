<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google chrome clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-first-line">
            <i class="fas fa-arrow-left" id="arrows"></i>
            <i class="fas fa-arrow-right" id="arrows"></i>
            <i class="fa-solid fa-rotate-right" id="reload"></i>
            <i class="fa-regular fa-house " id="home"></i>
            <div class="full-search-bar">
                <i class="fa-brands fa-google" id="google-search-icon"></i>
                <input type="search" placeholder="Ask google or type a URL" class="search-bar">
                <span class="google-account"><img src="my_google_account-icon.jpg" alt="google account"></span>
                <i class="fa-solid fa-ellipsis-vertical three-dots"></i>
            </div>
        </div>
        <div class="header-second-line">
            <i class="fa-solid fa-layer-group tab-group"></i>
            <span class="all-bookmarks"><i class="fa-regular fa-folder"></i>All Bookmarks</span>
        </div>
    </header>
    
    <div class="main-div">
        <div class="top-main-row">
            <a href="https://mail.google.com/mail/u/0/?tab=rm&ogbl#inbox" class="top-main-row-anchor-tag">Gmail</a>
            <a href="https://www.google.com/imghp?hl=en&tab=ri&ogbl" class="top-main-row-anchor-tag">Images</a>
            <img src="grid-dots-qu7memjnetdz4wt9rjypwg.webp" class="grid-in-top-main-row">
            <img src="google_account_icon_2.jpg" class="account-icon-in-top-main-row">

        </div>
        <div class="google-logo-in-main">
            <img src="google_logo.svg">
        </div>
        <div class="search-inner-div">
            <img src="add.svg" class="add-icon-in-main-search">
            <textarea placeholder="Ask Google" rows="1" class="textarea-in-main-search"></textarea>
            <img src="mic.svg" class="mic-icon-in-main-search">
            <img src="camera.svg" class="camera-icon-in-main-search">
            <div class="ai-mode-button">
                <img src="search_spark.svg" class="search-icon-in-ai-button">
                <span class="ai-mode-span">AI Mode</span>
            </div>
        </div>
        <div class="buttons-under-main-search">
            <button class="button-under-search-bar">
                <div class="image-in-first-button">
                    <img src="search_spark.svg">
                </div>
                <div class="span-tags-in-buttons">
                    <span class="first-span-in-button">Do More With AI Mode</span>
                    <span class="sec-span-in-button">Create, Plan, Summarize</span>
                </div>
            </button>
            <button class="button-under-search-bar">
                <div class="image-in-first-button">
                    <img src="banana.svg">
                </div>
                <div class="span-tags-in-buttons">
                    <span class="first-span-in-button">Create images</span>
                    <span class="sec-span-in-button">Add an image and reimagine it</span>
                </div>
            </button>
        </div>
        <div class="shortcuts-in-main">
            <a href="https://claude.ai/" class="anchor-tags-of-buttons"><img src="claude-color.svg" class="images-in-a-buttons">Claude</a>
            <a href="https://www.canva.com/en_gb/" class="anchor-tags-of-buttons"><img src="vecteezy_canva-icon-logo-symbol_32329175.png" class="images-in-a-buttons">Canva</a>
            <a href="https://youtube.com" class="anchor-tags-of-buttons"><img src="YouTube_23392.ico" class="images-in-a-buttons">Youtube</a>
            <a href="https://gemini.google.com/app" class="anchor-tags-of-buttons"><img src="gemini-color.svg" class="images-in-a-buttons">Gemini</a>
            <a href="https://www.facebook.com/app" class="anchor-tags-of-buttons"><img src="facebook.png" class="images-in-a-buttons">Facebook</a>
            <a href="#" class="anchor-tags-of-buttons"><p class="images-in-a-buttons plus-icon-of-add-shortcut">+</p>Add Shortcut</a>
        </div>
    </div>
</body>
</html>
